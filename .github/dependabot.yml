---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
    groups:
      ci-python-tools:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /packaging/test/almalinux
      - /packaging/test/almalinux9
      - /packaging/test/alpine
      - /packaging/test/debian
    schedule:
      interval: weekly
    groups:
      package-test-images:
        patterns: ["*"]
